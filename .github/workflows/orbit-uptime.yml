name: Orbit P0 readiness

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: vars.ORBIT_HEALTH_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public service readiness
        env:
          ORBIT_HEALTH_URL: ${{ vars.ORBIT_HEALTH_URL }}
        run: python3 scripts/operations/probe-readiness.py
