name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_APP_URL: https://build.invalid.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify project history
        run: npm run evolution:history

      # Only the in-repository service contract suite runs in GitHub CI.
      # The real Daily Report V2 checkout is covered by the explicit local
      # `npm run test:cross-project` command instead of a developer path.
      - name: Service contract tests (no external workspace)
        run: npm test

      - name: Build
        run: npm run build

      # A dependency-changing release is assembled on Linux; production only
      # receives this verified artifact and never installs or builds in place.
      - name: Prepare Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          stage="$RUNNER_TEMP/orbit-release"
          mkdir -p "$stage"
          git archive --prefix=smart-schedule-agent/ HEAD | tar -x -C "$stage"
          rm "$stage/smart-schedule-agent/AGENTS.md"
          cp -a dist node_modules "$stage/smart-schedule-agent/"
          node scripts/prepare-linux-release.mjs "$stage/smart-schedule-agent" "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/orbit-linux-release.tgz" -C "$stage" smart-schedule-agent
          sha256sum "$RUNNER_TEMP/orbit-linux-release.tgz" > "$RUNNER_TEMP/orbit-linux-release.sha256"

      - name: Upload Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-release
          path: |
            ${{ runner.temp }}/orbit-linux-release.tgz
            ${{ runner.temp }}/orbit-linux-release.sha256
          retention-days: 3
          compression-level: 0
