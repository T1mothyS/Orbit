name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.release-upload.outputs.artifact-id }}
    env:
      ELECTRON_APP_URL: https://build.invalid.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: UI boundaries
        run: npm run ui:lint

      - name: Verify project history
        run: npm run evolution:history

      # Only the in-repository service contract suite runs in GitHub CI.
      # The real Daily Report V2 checkout is covered by the explicit local
      # `npm run test:cross-project` command instead of a developer path.
      - name: Service contract tests (no external workspace)
        run: npm test

      - name: Build
        run: npm run build

      - name: Documentation and generated help integrity
        run: npm run docs:check -- --generated

      - name: Verify Gallery stays development-only
        run: node scripts/verify-ui-build.mjs

      - name: Install UI test browser
        run: npx playwright install --with-deps chromium

      - name: Install and verify Chinese UI font
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=zh-cn'

      - name: UI interactions and layout
        id: ui
        env:
          ORBIT_UI_QA_DIR: ${{ runner.temp }}/orbit-ui-tests
        run: npm run test:ui

      # Preserve the failed comparison. A separate fresh fixture captures ALL
      # candidates for review without writing baselines or making CI pass.
      - name: Capture visual candidates after a failed comparison
        if: failure() && steps.ui.outcome == 'failure'
        env:
          ORBIT_UI_QA_DIR: ${{ runner.temp }}/orbit-ui-candidates
          ORBIT_UI_VISUAL_CANDIDATES: '1'
        run: npm run test:ui

      - name: Upload unapproved visual candidates
        if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ui-candidates
          path: ${{ runner.temp }}/orbit-ui-candidates
          retention-days: 7

      - name: Upload UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ui-failures
          path: ${{ runner.temp }}/orbit-ui-tests
          retention-days: 7

      # A dependency-changing release is assembled on Linux; production only
      # receives this verified artifact and never installs or builds in place.
      - name: Prepare Linux release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          stage="$RUNNER_TEMP/orbit-release"
          mkdir -p "$stage"
          git archive --prefix=smart-schedule-agent/ HEAD | tar -x -C "$stage"
          rm "$stage/smart-schedule-agent/AGENTS.md"
          cp -a dist node_modules "$stage/smart-schedule-agent/"
          cp server/.product-help.json "$stage/smart-schedule-agent/server/"
          node scripts/prepare-linux-release.mjs "$stage/smart-schedule-agent" "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/orbit-linux-release.tgz" -C "$stage" smart-schedule-agent
          sha256sum "$RUNNER_TEMP/orbit-linux-release.tgz" > "$RUNNER_TEMP/orbit-linux-release.sha256"

      - name: Verify exact Linux archive in an isolated runtime
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          expected_sha="$(cut -d ' ' -f 1 "$RUNNER_TEMP/orbit-linux-release.sha256")"
          version="$(node -p 'require("./package.json").version')"
          python3 scripts/operations/verify-release-archive.py "$RUNNER_TEMP/orbit-linux-release.tgz" \
            --sha256 "$expected_sha" --commit "$GITHUB_SHA" --version "$version" \
            | tee "$RUNNER_TEMP/orbit-linux-release.inventory.json"
          smoke_root="$(mktemp -d "$RUNNER_TEMP/orbit-release-smoke.XXXXXX")"
          mkdir "$smoke_root/data" "$smoke_root/home"
          tar -xzf "$RUNNER_TEMP/orbit-linux-release.tgz" -C "$smoke_root"
          du -sk "$smoke_root/smart-schedule-agent"
          cd "$smoke_root/smart-schedule-agent"
          env -i PATH="$PATH" HOME="$smoke_root/home" DATA_DIR="$smoke_root/data" \
            APP_ENV=production APP_URL=https://release-smoke.invalid \
            JWT_SECRET=synthetic-release-smoke-only-not-a-secret \
            ADMIN_INVITE_CODE=synthetic-release-admin-code USER_INVITE_CODE=synthetic-release-user-code \
            ORBIT_RELEASE_SMOKE=true ORBIT_RELEASE_SMOKE_COMMIT="$GITHUB_SHA" BACKGROUND_JOBS_ENABLED=false \
            ORBIT_PROACTIVE_ENABLED=false ANDROID_PUSH_ENABLED=false \
            node --import tsx scripts/verify-linux-release.mjs

      - name: Upload Linux release
        id: release-upload
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-release
          path: |
            ${{ runner.temp }}/orbit-linux-release.tgz
            ${{ runner.temp }}/orbit-linux-release.sha256
            ${{ runner.temp }}/orbit-linux-release.inventory.json
          retention-days: 3
          compression-level: 0

  deploy:
    name: Deploy verified Linux release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ORBIT_CD_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    concurrency:
      group: orbit-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: release
      - name: Check signed release input
        run: |
          expected_sha="$(cut -d ' ' -f 1 release/orbit-linux-release.sha256)"
          version="$(node -p 'require("./package.json").version')"
          python3 scripts/operations/verify-release-archive.py release/orbit-linux-release.tgz \
            --sha256 "$expected_sha" --commit "$GITHUB_SHA" --version "$version" > release/verified.json
      - name: Deploy exact current main to production
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_DEPLOY_TARGET: ${{ secrets.ORBIT_DEPLOY_TARGET }}
          ORBIT_DEPLOY_SSH_KEY: ${{ secrets.ORBIT_DEPLOY_SSH_KEY }}
          ORBIT_DEPLOY_SIGNING_KEY: ${{ secrets.ORBIT_DEPLOY_SIGNING_KEY }}
          ORBIT_DEPLOY_KNOWN_HOSTS: ${{ secrets.ORBIT_DEPLOY_KNOWN_HOSTS }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit has superseded this release."
            exit 0
          fi
          python3 scripts/operations/send-release.py --archive release/orbit-linux-release.tgz --inventory release/verified.json
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        id: release
      - name: Verify public readiness and release identity
        if: steps.release.outputs.deployed == 'true'
        env:
          ORBIT_HEALTH_URL: ${{ vars.ORBIT_HEALTH_URL }}
        run: python3 scripts/operations/probe-readiness.py --commit "$GITHUB_SHA" --version "$(node -p 'require("./package.json").version')"
