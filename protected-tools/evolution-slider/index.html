(function (root) {
  'use strict';
  const STAGES = Object.freeze([
    { name: '小难梁', english: 'ORIGIN', description: '一切变化，始于此刻。', start: -15, end: -10 },
    { name: '牢梁', english: 'AWAKEN', description: '沉静之下，力量开始涌动。', start: -10, end: -5 },
    { name: '梁子', english: 'TRANSFORM', description: '突破轮廓，重塑可能。', start: -5, end: 0 },
    { name: '梁圣', english: 'ASCEND', description: '每一次向前，都是新的高度。', start: 0, end: 5 },
    { name: '梁神', english: 'APEX', description: '让积蓄的力量，完整呈现。', start: 5, end: 10 },
    { name: '梁祖', english: 'BEYOND', description: '抵达边界，然后跨越。', start: 10, end: 15 }
  ].map(Object.freeze));

  function describeScore(value) {
    const number = Number(value);
    const score = Math.max(-15, Math.min(15, Number.isFinite(number) ? number : -15));
    const trackProgress = (score + 15) / 30;
    const stageIndex = Math.min(5, Math.floor(trackProgress * 6));
    const stage = STAGES[stageIndex];
    return {
      score,
      displayScore: `${score > 0 ? '+' : score < 0 ? '−' : ''}${Math.abs(score).toFixed(2)}`,
      frameIndex: Math.round(trackProgress * 30),
      stage,
      stageIndex,
      stageProgress: Math.max(0, Math.min(1, (score - stage.start) / (stage.end - stage.start))),
      trackProgress
    };
  }

  const api = Object.freeze({ STAGES, describeScore });
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.EvolutionScore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function (root) {
  'use strict';

  // One seek at a time. Input replaces the pending destination; it never queues work.
  function createSeekController(video, draw, options = {}) {
    const raf = options.raf || requestAnimationFrame;
    const cancelRaf = options.cancelRaf || cancelAnimationFrame;
    const onError = options.onError || (() => {});
    let pendingTargetTime = null;
    let seekInFlight = false;
    let animationFrame = null;
    let decodedCallback = null;
    let fallbackFrame = null;
    let watchdog = null;
    let seekCompleted = false;
    let frameDecoded = false;
    let destroyed = false;
    let activeTargetTime = 0;

    function clearFrameWait() {
      if (decodedCallback !== null && video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(decodedCallback);
      if (fallbackFrame !== null) cancelRaf(fallbackFrame);
      clearTimeout(watchdog);
      decodedCallback = fallbackFrame = watchdog = null;
    }

    function schedule() {
      if (!destroyed && animationFrame === null) animationFrame = raf(pump);
    }

    function finish() {
      if (!seekInFlight || !seekCompleted || destroyed) return;
      clearFrameWait();
      seekInFlight = false;
      // Present every completed decode, so sustained dragging keeps moving too.
      draw(video);
      if (pendingTargetTime !== null) schedule();
    }

    function handleSeeked() {
      if (!seekInFlight || video.seeking) return;
      seekCompleted = true;
      if (frameDecoded) return finish();
      // Some paused-video implementations defer rVFC until playback. After seeked,
      // HAVE_CURRENT_DATA guarantees a decoded frame; give rVFC two paints first.
      fallbackFrame = raf(() => {
        fallbackFrame = raf(() => {
          fallbackFrame = null;
          if (video.readyState >= 2 && !video.seeking) finish();
        });
      });
    }

    function pump() {
      animationFrame = null;
      if (destroyed || seekInFlight || pendingTargetTime === null || video.readyState < 2) return;
      const targetTime = pendingTargetTime;
      pendingTargetTime = null;
      if (!video.seeking && Math.abs(video.currentTime - targetTime) < 0.001) {
        draw(video);
        return;
      }
      seekInFlight = true;
      seekCompleted = frameDecoded = false;
      activeTargetTime = targetTime;
      if (video.requestVideoFrameCallback) {
        decodedCallback = video.requestVideoFrameCallback(() => {
          decodedCallback = null;
          frameDecoded = true;
          if (seekCompleted) finish();
        });
      }
      // A stalled decoder must never hold the input queue permanently.
      watchdog = setTimeout(() => {
        if (!video.seeking && video.readyState >= 2) {
          seekCompleted = true;
          finish();
        } else {
          clearFrameWait();
          seekInFlight = false;
          onError(new Error('Video seek did not finish.'));
        }
      }, 2500);
      try {
        video.currentTime = targetTime;
      } catch (error) {
        clearFrameWait();
        seekInFlight = false;
        onError(error);
      }
    }

    video.addEventListener('seeked', handleSeeked);
    return {
      request(time) {
        if (destroyed || !Number.isFinite(time)) return;
        pendingTargetTime = Math.max(0, time);
        schedule();
      },
      get state() { return { pendingTargetTime, seekInFlight, activeTargetTime }; },
      destroy() {
        destroyed = true;
        clearFrameWait();
        if (animationFrame !== null) cancelRaf(animationFrame);
        video.removeEventListener('seeked', handleSeeked);
      }
    };
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = { createSeekController };
  else root.createSeekController = createSeekController;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

  let videoReady = false;
  let fallback = !context;
  let usingMp4 = false;
  let posterRequest = 0;
  let lastPosterIndex = 0;
  let lastDrawnTime = null;
  let fallbackRaf = null;
  let fatalMediaFailure = false;
  const posterCache = new Map();

  for (let i = 0; i <= 30; i++) {
    const tick = document.createElement('span');
    tick.className = `tick${i % 6 === 0 ? ' is-major' : ''}`;
    document.getElementById('ticks').appendChild(tick);
  }
  const ticks = [...document.querySelectorAll('.tick')];

  const mix = (a, b, p) => a.map((value, i) => Math.round(value + (b[i] - value) * p));
  const rgb = values => `rgb(${values.join(',')})`;
  const luminance = color => color.map(value => {
    const v = value / 255;
    return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  }).reduce((sum, value, i) => sum + value * [0.2126, 0.7152, 0.0722][i], 0);
  function legible(candidate, background) {
    const ground = luminance(background);
    const end = ground < 0.179 ? [255, 255, 255] : [0, 0, 0];
    for (let step = 0; step <= 20; step++) {
      const color = mix(candidate, end, step / 20);
      const light = luminance(color);
      if ((Math.max(ground, light) + 0.05) / (Math.min(ground, light) + 0.05) >= 4.5) return rgb(color);
    }
    return rgb(end);
  }
  function theme(progress) {
    const background = mix([238, 239, 235], [15, 17, 16], progress);
    root.style.setProperty('--strength', progress.toFixed(5));
    root.style.setProperty('--paper', rgb(mix([238, 239, 235], [15, 17, 16], progress)));
    // Ink changes polarity as the paper passes middle gray to preserve contrast.
    const dark = progress >= 0.55;
    root.style.setProperty('--ink', dark ? rgb(mix([236, 233, 223], [244, 238, 220], progress)) : rgb(mix([28, 32, 27], [8, 10, 8], progress)));
    root.style.setProperty('--muted', dark ? rgb(mix([220, 219, 210], [170, 167, 153], progress)) : rgb(mix([96, 102, 94], [30, 34, 29], progress)));
    root.style.setProperty('--line', dark ? rgb(mix([154, 154, 140], [68, 66, 55], progress)) : rgb(mix([191, 197, 186], [103, 109, 98], progress)));
    root.style.setProperty('--accent', dark ? rgb(mix([230, 220, 186], [207, 173, 102], progress)) : rgb(mix([71, 88, 58], [77, 58, 23], progress)));
    root.style.setProperty('--glow', (progress * 0.15).toFixed(3));
    root.style.setProperty('--word-opacity', (0.07 + progress * 0.05).toFixed(3));
    root.style.setProperty('--word-scale', (1 + progress * 0.04).toFixed(3));
    root.style.setProperty('--portrait-shadow', (0.12 + progress * 0.22).toFixed(3));
    // Keep all text readable even at the middle gray of the continuous transition.
    root.style.setProperty('--ink', legible(dark ? [244,238,220] : [28,32,27], background));
    root.style.setProperty('--muted', legible(dark ? [170,167,153] : [96,102,94], background));
    root.style.setProperty('--accent', legible(dark ? mix([230,220,186],[207,173,102],progress) : mix([71,88,58],[77,58,23],progress), background));
    root.style.colorScheme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').content = rgb(mix([238,239,235],[15,17,16],progress));
  }

  function setEnabled() {
    slider.disabled = reset.disabled = false;
    stageButtons.forEach(button => { button.disabled = false; });
  }

  function showPoster(index) {
    if (lastPosterIndex === index && poster.complete && poster.naturalWidth) return;
    const request = ++posterRequest;
    let image = posterCache.get(index);
    if (!image) {
      image = new Image();
      image.src = `assets/evolution/frames/frame-${String(index).padStart(2, '0')}.webp`;
      posterCache.set(index, image);
    }
    function display() {
      if (request !== posterRequest || !image.naturalWidth) return;
      poster.src = image.src;
      lastPosterIndex = index;
      poster.alt = `${current.stage.name}，强度 ${current.displayScore}`;
    }
    if (image.complete) display();
    else image.addEventListener('load', display, { once: true });
  }

  function usePosters() {
    fatalMediaFailure = true;
    clearTimeout(initialTimer);
    fallback = true;
    videoReady = false;
    controller.destroy();
    portrait.classList.remove('has-video');
    status.textContent = '关键帧模式 · 可继续拖动';
    showPoster(current.frameIndex);
    setEnabled();
  }

  function draw(source) {
    if (fallback || !context || source.readyState < 2 || !source.videoWidth) return;
    try {
      context.drawImage(source, 0, 0, canvas.width, canvas.height);
      lastDrawnTime = source.currentTime;
      canvas.dataset.renderedTime = String(lastDrawnTime);
      portrait.classList.add('has-video');
    } catch (_) { usePosters(); }
  }

  const controller = createSeekController(video, draw, { onError: usePosters });
  function resizeCanvas() {
    const rect = portrait.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(rect.width * dpr));
    const height = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width === width && canvas.height === height) return;
    canvas.width = width;
    canvas.height = height;
    if (lastDrawnTime !== null && !video.seeking) draw(video);
    else portrait.classList.remove('has-video');
  }

  // The supplied video has 241 frames at 30fps (8s content + final frame hold).
  // Never seek duration itself: it can be an undecodable end-of-stream position.
  function targetTime(progress) {
    return progress * Math.max(0, video.duration - 1 / 30);
  }

  function update(value) {
    current = describeScore(value);
    slider.value = String(current.score);
    output.value = current.displayScore;
    slider.setAttribute('aria-valuetext', `${current.displayScore}，${current.stage.name}`);
    counter.textContent = String(current.stageIndex + 1).padStart(2, '0');
    name.textContent = current.stage.name;
    english.textContent = word.textContent = current.stage.english;
    description.textContent = current.stage.description;
    canvas.setAttribute('aria-label', `${current.stage.name}，强度 ${current.displayScore}`);
    frameNumber.textContent = `F / ${String(current.frameIndex).padStart(2, '0')}`;
    stageButtons.forEach((button, index) => {
      const active = index === current.stageIndex;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    ticks.forEach((tick, index) => tick.classList.toggle('is-active', index <= current.trackProgress * 30));
    theme(current.trackProgress);
    if (videoReady) controller.request(targetTime(current.trackProgress));
    else if (fallback) {
      if (fallbackRaf === null) fallbackRaf = requestAnimationFrame(() => {
        fallbackRaf = null;
        showPoster(current.frameIndex);
      });
    }
  }

  slider.addEventListener('input', () => update(slider.value));
  stageButtons.forEach((button, index) => button.addEventListener('click', () => update(index === 5 ? 15 : STAGES[index].start)));
  reset.addEventListener('click', () => update(-15));
  window.addEventListener('resize', resizeCanvas, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(portrait);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && videoReady) controller.request(targetTime(current.trackProgress));
  });

  let initialTimer = setTimeout(() => {
    // Keep the toy usable on very slow connections, while still allowing video recovery.
    fallback = true;
    status.textContent = '视频加载中 · 关键帧可用';
    setEnabled();
    showPoster(current.frameIndex);
  }, 5000);

  video.addEventListener('loadeddata', () => {
    if (fatalMediaFailure) return;
    if (!context || !Number.isFinite(video.duration) || video.duration <= 0) return usePosters();
    clearTimeout(initialTimer);
    fallback = false;
    videoReady = true;
    resizeCanvas();
    status.textContent = '画面就绪 · 随心拖动';
    setEnabled();
    controller.request(targetTime(current.trackProgress));
  });

  function tryMp4() {
    if (fatalMediaFailure) return;
    if (usingMp4) { clearTimeout(initialTimer); initialTimer = null; return usePosters(); }
    usingMp4 = true;
    video.src = 'assets/evolution/evolution.mp4';
    video.load();
  }
  video.addEventListener('error', tryMp4);
  // Browser source selection handles unsupported codecs. A failed WebM network load
  // can fire only on <source>, so explicitly try MP4 for that case as well.
  const sources = [...video.querySelectorAll('source')];
  const failedSources = new Set();
  sources.forEach(source => source.addEventListener('error', () => {
    failedSources.add(source);
    // Source errors may fire before networkState becomes NETWORK_NO_SOURCE.
    if (failedSources.size === sources.length && !videoReady) tryMp4();
  }));

  poster.addEventListener('error', () => {
    status.textContent = '预览图未找到，请检查 assets/evolution/frames';
  });
  resizeCanvas();
  update(slider.value);
  if (video.readyState >= 2) video.dispatchEvent(new Event('loadeddata'));
  else setTimeout(() => {
    // Inline builds run before the browser's asynchronous source selection.
    // Wait one task before checking for source errors missed by deferred scripts.
    if (!videoReady && !fatalMediaFailure && (video.networkState === 3 || video.error)) tryMp4();
  }, 0);
  if (!context) { clearTimeout(initialTimer); usePosters(); }
})();

</script>
</body>
</html>
